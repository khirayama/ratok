name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and create Sparkle appcast
        env:
          RATOK_UPDATE_PUBLIC_KEY: ${{ vars.RATOK_UPDATE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh scripts/package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/Ratok-*.zip" \
            "dist/release/appcast.xml" \
            --title "Ratok $GITHUB_REF_NAME" \
            --generate-notes
